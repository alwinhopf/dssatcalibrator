# =============================================================================
# config_hemp_glue_1000.yaml — calibrate CROPGRO-Hemp (HMGRO048) with N=1000
# and 24 active parameters.
# =============================================================================

calibrator:
  name: "hemp_yunnan_2021_2022_glue_1000"
  seed: 42
  workdir: "results/_workdir"
  results_dir: "results"
  figures_dir: "figures"
  dssat_exe: "C:/DSSAT48/dscsm048_compiled_4.8.2.with_HM_code.exe"
  dssat_dir: "C:/DSSAT48"
  num_cores: 0
  cache_spawns: false
  keep_run_dirs: false

source:
  hemp_dir: "C:/DSSAT48/Hemp"
  observations: "dssat"

experiments:
  - CNKU2101
  - YUFE2101
  - YUFE2201
  - YUBA2101
  - YUKU2101
  - YUKU2201

engine:
  run_mode: "experiment"
  timeseries_outputs:
    biomass: "CWAD"
    leaf:    "LWAD"
    stem:    "SWAD"
    grain:   "GWAD"
    height:  "CHTD"
    LAI:     "LAID"
  scalar_outputs:
    anthesis: "ADAP"
    emergence: "EDAP"
    maturity: "MDAP"
    grain_yield: "HWAM"
    biomass_maturity: "CWAM"
    max_LAI: "LAIX"
    canopy_height: "CHTA"

method:
  preset: "C"
  sample: { engine: "lhs", n: 1000 }
  bayesian: { engine: "glue", behavioural_quantile: 0.1 }
  validation: { scheme: "loeo" }
  multiobjective: { engine: "none" }

objective:
  weighting: "unified"
  weights: { biomass: 1.0, grain_yield: 1.0, anthesis: 1.0, height: 0.5, LAI: 1.0 }
  error_model:
    biomass:     { type: relative, value: 0.20 }
    grain_yield: { type: relative, value: 0.15 }
    height:      { type: relative, value: 0.15 }
    LAI:         { type: relative, value: 0.20 }
    anthesis:    { type: absolute, value: 3 }
    maturity:    { type: absolute, value: 5 }

crops:
  - code: "HM"
    model: "CRGRO048"
    genotype_stem: "HMGRO048"
    cultivar_anchor: "IB0008"
    ecotype: "HM0003"
    filex_ext: "HMX"
    stage_scale: "cropgro"

parameters:
  genetic_cultivar:
    # -- Phenology (class P) -> active, obligatory
    "CSDL":  { active: true,  role: obligatory, min: 11.5, max: 18.0, start: 12.8, prior: {dist: uniform} }
    "PPSEN": { active: true,  role: obligatory, min: 0.1, max: 1.0, start: 0.9,  prior: {dist: uniform} }
    "EM-FL": { active: true,  role: obligatory, min: 10.0, max: 60.0, start: 30.0,  prior: {dist: uniform} }
    "FL-SD": { active: true,  role: obligatory, min: 1.0,  max: 30.0, start: 15.0,  prior: {dist: uniform} }
    "SD-PM": { active: true,  role: obligatory, min: 5.0,  max: 90.0, start: 50.0,  prior: {dist: uniform} }
    # -- Growth (class G) -> active, candidate
    "LFMAX": { active: true,  role: candidate,  min: 0.3, max: 2.5, start: 1.4,  prior: {dist: uniform} }
    "SLAVR": { active: true,  role: candidate,  min: 50.0, max: 500.0, start: 250.0, prior: {dist: uniform} }
    "SIZLF": { active: true,  role: candidate,  min: 50.0, max: 500.0, start: 250.0, prior: {dist: uniform} }
    "WTPSD": { active: true,  role: candidate,  min: 0.01, max: 1.2, start: 0.035, prior: {dist: uniform} }
    "SFDUR": { active: true,  role: candidate,  min: 10.0, max: 45.0, start: 20.0,  prior: {dist: uniform} }
    "SDPDV": { active: true,  role: candidate,  min: 1.0,  max: 100.0, start: 1.0,   prior: {dist: uniform} }
    # -- Expanded parameters now active
    "FL-SH": { active: true,  min: 1.0,  max: 25.0, start: 10.0,  prior: {dist: uniform} }
    "FL-LF": { active: true,  min: 5.0, max: 100.0, start: 40.0,  prior: {dist: uniform} }
    "XFRT":  { active: true,  min: 0.05, max: 0.98, start: 0.6,  prior: {dist: uniform} }
    "PODUR": { active: true,  min: 3.0,  max: 60.0, start: 30.0,  prior: {dist: uniform} }
    "THRSH": { active: true,  min: 50.0, max: 95.0, start: 80.0,  prior: {dist: uniform} }
    "SDPRO": { active: true,  min: 0.1, max: 0.5, start: 0.256, prior: {dist: uniform} }
    "SDLIP": { active: true,  min: 0.02, max: 0.55, start: 0.319, prior: {dist: uniform} }

  genetic_ecotype:
    "PL-EM": { active: true,  min: 1.0,  max: 8.0,  start: 4.0,  prior: {dist: uniform} }
    "RHGHT": { active: true,  min: 0.4,  max: 3.0,  start: 1.5,  prior: {dist: uniform} }
    "EM-V1": { active: true,  min: 0.5,  max: 8.0,  start: 3.0,  prior: {dist: uniform} }
    "TRIFL": { active: true,  min: 0.05, max: 1.0, start: 0.25, prior: {dist: uniform} }
    "RWDTH": { active: true,  min: 0.4,  max: 2.5,  start: 1.0,  prior: {dist: uniform} }
    "R1PPO": { active: true,  min: 0.0, max: 1.2,  start: 0.504, prior: {dist: uniform} }

  management:
    plant_population: { active: false, min: 2,   max: 100, start: 25, dssat: PPOP, unit: "plants/m2" }
    row_spacing:      { active: false, min: 20,  max: 100, start: 50, dssat: PLRS, unit: cm }
    planting_depth:   { active: false, min: 1.0, max: 6.0, start: 2.5, dssat: PLDP, unit: cm }

  initial_conditions:
    initial_soil_water_mult: { active: false, min: 0.6, max: 1.4, start: 1.0 }

  soil:
    soil_water_holding_mult: { active: false, min: 0.8, max: 1.2, start: 1.0, dssat: SDUL, op: mult, unit: "x" }
    lower_limit_mult:        { active: false, min: 0.8, max: 1.2, start: 1.0, dssat: SLLL, op: mult, unit: "x" }
    root_growth_factor_mult: { active: false, min: 0.5, max: 1.5, start: 1.0, dssat: SRGF, op: mult, unit: "x" }
    soil_fertility_factor:   { active: false, min: 0.5, max: 1.0, start: 1.0, dssat: SLPF, op: set,  unit: "0-1" }

  weather:
    radiation_mult: { active: false, min: 0.9, max: 1.1, start: 1.0, dssat: SRAD, op: mult, unit: "x" }
    tmax_offset:    { active: false, min: -2.0, max: 2.0, start: 0.0, dssat: TMAX, op: off,  unit: "degC" }
    tmin_offset:    { active: false, min: -2.0, max: 2.0, start: 0.0, dssat: TMIN, op: off,  unit: "degC" }
    rainfall_mult:  { active: false, min: 0.7, max: 1.3, start: 1.0, dssat: RAIN, op: mult, unit: "x" }
