# =============================================================================
# config_hemp.yaml — calibrate the CROPGRO-Hemp (HMGRO048) model for the
# Yunnan/China hemp cultivar trials. Cultivar anchor IB0008 "YUNMA8".
#
# Coefficient start values, P/G/N calibration classes and the cultivar spread
# used to set bounds are taken from C:/DSSAT48/Genotype/HMGRO048.CUL.
#   P = phenology, G = growth (both calibrated), N = not used for calibration.
# Precedence: environment (DSSATCAL_*) > this file > built-in defaults.
# =============================================================================

calibrator:
  # Unique name for this calibration run. Organizer for all output/figures directories.
  name: "hemp_yunnan_2021_2022"
  
  # Random seed for LHS sampling, MCMC particle mutation, and reproducibility.
  seed: 42
  
  # Directory where temporary DSSAT spawn workspaces are created.
  workdir: "results/_workdir"
  
  # Directory where output data tables (best parameters, fit metrics) are saved.
  results_dir: "results"
  
  # Directory where output visualizations and plots (posterior curves, timeseries) are saved.
  figures_dir: "figures"
  
  # Path to the compiled DSSAT executable containing the Hemp crop module.
  dssat_exe: "C:/DSSAT48/dscsm048_compiled_4.8.2.with_HM_code.exe"
  
  # Path to the root DSSAT installation directory (contains Soil, Weather, Genotype).
  dssat_dir: "C:/DSSAT48"
  
  # Number of parallel workers/cores to run DSSAT spawns. 0 = (physical cores - 2).
  num_cores: 0
  
  # Whether to cache spawns with identical parameter settings to avoid redundant DSSAT executions.
  cache_spawns: false
  
  # Whether to keep the temporary DSSAT workspace folders after execution (false = cleanup to save disk space).
  keep_run_dirs: false

# DSSAT execution backend. `native` preserves the local fallback; `dssatengine`
# delegates batch writing and model spawning to the shared workspace engine.
execution:
  backend: "native"            # native | dssatengine

# Shared FileX/genotype template directory for synthesized/new-site experiments.
# Empty = DSSAT_TEMPLATE_DIR env var, then ../DSSAT_Gridded_Run_Tutorial/dssat_templates.
templates:
  template_dir: ""

# --- Source settings: where experimental layouts and observations are read ---
source:
  # Directory containing .HMX experimental files, .HMA final season, and .HMT timeseries files.
  hemp_dir: "C:/DSSAT48/Hemp"
  
  # Observation reader source mode. 'dssat' parses FileA/FileT. Can also point to a long CSV file path.
  observations: "dssat"

# Subset of active experiments to calibrate against (excluded YUBA2201 automatically due to no observations).
experiments:
  - CNKU2101    # Yunnan CNKU 2021: FileT observations (timeseries biomass/height)
  - YUFE2101    # Yunnan YUFE 2021: FileA (harvest) + FileT observations
  - YUFE2201    # Yunnan YUFE 2022: FileA (harvest) + FileT observations
  - YUBA2101    # Yunnan YUBA 2021: FileA observations only
  - YUKU2101    # Yunnan YUKU 2021: FileA + FileT observations
  - YUKU2201    # Yunnan YUKU 2022: FileA + FileT observations

# --- Output maps: variables to score, extracted from DSSAT output files ---
engine:
  # DSSAT run mode. 'experiment' runs DSSAT in batch mode using treatment specifications.
  run_mode: "experiment"
  
  # Daily timeseries outputs to parse from PlantGro.OUT (maps user-variable to DSSAT column header).
  timeseries_outputs:
    biomass: "CWAD"     # Tops dry weight (kg/ha)
    leaf:    "LWAD"     # Leaf dry weight (kg/ha)
    stem:    "SWAD"     # Stem dry weight (kg/ha)
    grain:   "GWAD"     # Seed dry weight (kg/ha)
    height:  "CHTD"     # Canopy height (m)
    LAI:     "LAID"     # Leaf Area Index (m2/m2)
    
  # End-of-season final scalar outputs to parse from Evaluate.OUT.
  scalar_outputs:
    anthesis: "ADAP"    # Days from planting to anthesis (days)
    emergence: "EDAP"   # Days from planting to emergence (days)
    maturity: "MDAP"    # Days from planting to physiological maturity (days)
    grain_yield: "HWAM" # Harvest product yield at maturity (dry weight, kg/ha)
    biomass_maturity: "CWAM" # Tops weight at maturity (kg/ha)
    max_LAI: "LAIX"      # Maximum Leaf Area Index
    canopy_height: "CHTA" # Canopy height at maturity (m)

# --- Calibration algorithm and sampling settings ---
# A `preset` wires up the whole pipeline. The OPTIONAL helper stages (sensitivity,
# select, surrogate) stay OFF until you set `active: true` on them — so a bare preset
# just runs its main estimator. See WALKTHROUGH.md §5-§6 for a plain-language guide.
method:
  # Workflow preset (picks the main estimator):
  #   A = morris -> lhs -> smc_pf   (particle filter; posterior + uncertainty)   [recommended]
  #   B = morris -> diffevo         (optimiser; single best-fit point)
  #   C = lhs -> glue               (GLUE; quick, fully parallel)                [default]
  #   D = morris -> sobol -> mcmc   (full MCMC posterior; heaviest)
  preset: "A"

  # Initial sampler settings:
  #   engine: 'lhs' (Latin Hypercube) | 'sobol' | 'montecarlo' (random) | 'grid' (factorial).
  #   n: number of sample design points to generate.
  sample: { engine: "lhs", n: 250 }

  # OPTIONAL — Sensitivity screening: rank which parameters matter, then (optionally)
  # calibrate only those. engine: 'morris' (cheap, no extra deps) | 'sobol' (needs SALib).
  #   active: true to run it.  auto_activate: true to freeze the un-influential params.
  sensitivity: { engine: "morris", active: false, trajectories: 12, auto_activate: false }

  # OPTIONAL — AgMIP stepwise selection: estimate obligatory params, then add candidate
  # params one at a time, keeping each only if it lowers BIC (overfit guard).
  #   engine: 'stepwise_bic' | 'stepwise_aicc'.  active: true to run it.
  select: { engine: "stepwise_bic", active: false }

  # OPTIONAL — Surrogate acceleration: train a fast GP/RF emulator on a small design
  # and validate the best candidates on the real model. engine: 'gp' | 'rf' (needs scikit-learn).
  surrogate: { engine: "gp", active: false, n_train: 64, top_k: 10 }

  # Bayesian engine settings (used when preset/bayesian.engine is glue | smc_pf | mcmc):
  #   n_particles: particle count for SMC-PF.
  #   ess_frac: resampling triggers when effective sample size drops below (ess_frac * N).
  #   move_kernel: SMC mutation kernel ('adaptive' scales to ensemble spread, 'fixed' constant).
  #   kernel_floor: minimum proposal SD (fraction of range) — fights particle impoverishment.
  #   behavioural_quantile: top fraction of fits kept as 'behavioural' (0.1 = best 10%).
  #   (MCMC adds: n_walkers, n_steps, burn_in, thin, proposal_scale.)
  bayesian: { engine: "smc_pf", n_particles: 250, ess_frac: 0.5,
              move_kernel: adaptive, kernel_floor: 0.01, behavioural_quantile: 0.1 }

  # Optimiser settings (used when preset B / optimizer.engine set): 'nelder_mead' | 'diffevo'.
  optimizer: { engine: "none", restarts: 4, popsize: 15 }

  # Cross-validation strategy. 'loeo' = Leave-One-Environment-Out, 'year' = Leave-One-Year-Out, 'none' = calibrate all.
  validation: { scheme: "loeo" }

  # Multi-objective Pareto front optimization settings. 'nsga2' = NSGA-II, 'none' = single unified objective.
  multiobjective: { engine: "none" }

# --- Objective/Loss function scoring setup ---
objective:
  # How the variables (LAI, biomass, yield, phenology) combine into one score:
  #   unified     : sum of each variable's average normalised error (balanced; default).
  #   count_scale : like unified but averaged, so point-rich series can't dominate.
  #   sigma       : strict sigma-weighted chi-square (what the Bayesian engines use).
  #   user        : raw normalised RMSE x the explicit `weights` below.
  #   agmip_wls   : auto-set each variable's weight to 1/residual-variance (AgMIP default).
  weighting: "unified"

  # Down-weight dense daily time-series for serial correlation (so a long LAI series
  # does not unfairly outweigh a single end-of-season yield). true | false.
  obs_autocorr: false

  # Importance weight multiplier per variable.
  weights: { biomass: 1.0, grain_yield: 1.0, anthesis: 1.0, height: 0.5, LAI: 1.0 }
  
  # Error models defining measurement uncertainty (sigma) for likelihood calculation.
  #   type: 'relative' (fraction of observed value) or 'absolute' (fixed value in units).
  error_model:
    biomass:     { type: relative, value: 0.20 }
    grain_yield: { type: relative, value: 0.15 }
    height:      { type: relative, value: 0.15 }
    LAI:         { type: relative, value: 0.20 }
    anthesis:    { type: absolute, value: 3 }   # +/- 3 days uncertainty
    maturity:    { type: absolute, value: 5 }   # +/- 5 days uncertainty

# --- Crop and Model metadata block ---
crops:
  - code: "HM"                  # 2-letter crop code (e.g., HM = Hemp)
    model: "CRGRO048"           # Model argument passed to DSSAT executable
    genotype_stem: "HMGRO048"   # File stem name for .CUL / .ECO / .SPE genotype database files
    cultivar_anchor: "IB0008"   # Cultivar code row to calibrate in the .CUL file (e.g., YUNMA8)
    ecotype: "HM0003"           # Ecotype code row to calibrate in the .ECO file (e.g., HYBRID HEMP China)
    filex_ext: "HMX"            # FileX file extension
    stage_scale: "cropgro"      # Phenology stage tracking scheme

# =============================================================================
# PARAMETERS — cultivar coefficients (HMGRO048.CUL columns), then management /
# initial conditions. active=true enters calibration; start = IB0008 value.
# role: obligatory (phenology drivers) | candidate (growth) for the AgMIP
# stepwise selector (future work) — informative now.
# =============================================================================
parameters:

  genetic_cultivar:
    # -- Phenology (class P) -> active, obligatory ----------------------------
    # NOTE: ranges widened 2026-06-13 where the optimum pressed against a bound in a
    # pilot run (FL-SD min, SD-PM max) and to give the under-simulating growth
    # coefficients head-room. Sanity-check these against hemp literature before a
    # production run — wide uniform priors only widen the search, they don't bias it.
    "CSDL":  { active: true,  role: obligatory, min: 11.5, max: 18.0, start: 12.8, prior: {dist: uniform} }
    "PPSEN": { active: true,  role: obligatory, min: 0.1, max: 1.0, start: 0.9,  prior: {dist: uniform} }
    "EM-FL": { active: true,  role: obligatory, min: 10.0, max: 60.0, start: 30.0,  prior: {dist: uniform} }
    "FL-SD": { active: true,  role: obligatory, min: 1.0,  max: 30.0, start: 15.0,  prior: {dist: uniform} }
    "SD-PM": { active: true,  role: obligatory, min: 5.0,  max: 90.0, start: 50.0,  prior: {dist: uniform} }
    # -- Growth (class G) -> active, candidate --------------------------------
    "LFMAX": { active: true,  role: candidate,  min: 0.3, max: 2.5, start: 1.4,  prior: {dist: uniform} }
    "SLAVR": { active: true,  role: candidate,  min: 50.0, max: 500.0, start: 250.0, prior: {dist: uniform} }
    "SIZLF": { active: true,  role: candidate,  min: 50.0, max: 500.0, start: 250.0, prior: {dist: uniform} }
    "WTPSD": { active: true,  role: candidate,  min: 0.01, max: 1.2, start: 0.035, prior: {dist: uniform} }
    "SFDUR": { active: true,  role: candidate,  min: 10.0, max: 45.0, start: 20.0,  prior: {dist: uniform} }
    "SDPDV": { active: true,  role: candidate,  min: 1.0,  max: 100.0, start: 1.0,   prior: {dist: uniform} }
    # -- Not used for calibration (class N) -> declared, dormant --------------
    "FL-SH": { active: false, min: 1.0,  max: 25.0, start: 10.0 }
    "FL-LF": { active: false, min: 5.0,  max: 100.0, start: 40.0 }
    "XFRT":  { active: false, min: 0.05, max: 0.98, start: 0.6 }
    "PODUR": { active: false, min: 3.0,  max: 60.0, start: 30.0 }
    "THRSH": { active: false, min: 50.0, max: 95.0, start: 80.0 }
    "SDPRO": { active: false, min: 0.1, max: 0.5, start: 0.256 }
    "SDLIP": { active: false, min: 0.02, max: 0.55, start: 0.319 }

  genetic_ecotype:
    "PL-EM": { active: true,  min: 1.0,  max: 8.0,  start: 4.0,  prior: {dist: uniform} }
    "RHGHT": { active: true,  min: 0.4,  max: 3.0,  start: 1.5,  prior: {dist: uniform} }

  # -- Management (treatment-defined here -> dormant; available to vary) -------
  management:
    plant_population: { active: false, min: 2,   max: 100, start: 25, dssat: PPOP, unit: "plants/m2" }
    row_spacing:      { active: false, min: 20,  max: 100, start: 50, dssat: PLRS, unit: cm }
    planting_depth:   { active: false, min: 1.0, max: 6.0, start: 2.5, dssat: PLDP, unit: cm }

  # -- Initial conditions (dormant by default) --------------------------------
  initial_conditions:
    initial_soil_water_mult: { active: false, min: 0.6, max: 1.4, start: 1.0 }

  # -- Soil (.SOL profile; dormant). op: mult => multiply every layer of the
  #    DSSAT column; op: set => set the profile-level scalar. ----------------
  soil:
    soil_water_holding_mult: { active: false, min: 0.8, max: 1.2, start: 1.0, dssat: SDUL, op: mult, unit: "x" }
    lower_limit_mult:        { active: false, min: 0.8, max: 1.2, start: 1.0, dssat: SLLL, op: mult, unit: "x" }
    root_growth_factor_mult: { active: false, min: 0.5, max: 1.5, start: 1.0, dssat: SRGF, op: mult, unit: "x" }
    soil_fertility_factor:   { active: false, min: 0.5, max: 1.0, start: 1.0, dssat: SLPF, op: set,  unit: "0-1" }

  # -- Weather (.WTH; dormant). op: mult => factor; op: off => additive offset.
  #    Primarily for input-uncertainty / bias-correction studies, not classic
  #    genetic calibration. ---------------------------------------------------
  weather:
    radiation_mult: { active: false, min: 0.9, max: 1.1, start: 1.0, dssat: SRAD, op: mult, unit: "x" }
    tmax_offset:    { active: false, min: -2.0, max: 2.0, start: 0.0, dssat: TMAX, op: off,  unit: "degC" }
    tmin_offset:    { active: false, min: -2.0, max: 2.0, start: 0.0, dssat: TMIN, op: off,  unit: "degC" }
    rainfall_mult:  { active: false, min: 0.7, max: 1.3, start: 1.0, dssat: RAIN, op: mult, unit: "x" }

# =============================================================================
# MULTI-SOURCE IN-SEASON OBSERVATION ASSIMILATION (optional — all OFF here)
# See WALKTHROUGH.md §15 and CONCEPT.md §17. When `observation_sources` has any
# active adapter, the calibrator loads + fuses those instead of FileA/FileT.
# Each row a source emits must map to a variable in engine.timeseries_outputs /
# scalar_outputs above (and to a DSSAT output) or it is ignored when scoring —
# e.g. soil_moisture_iot (SW) / canopy_temperature (TMEAN) are NOT scored unless
# you add them there and DSSAT outputs them.
# =============================================================================
observation_sources:
  # adapter names: sentinel2_lai | modis_lai | farm_phenology | farm_management |
  #                field_measurements | soil_moisture_iot | canopy_temperature |
  #                uav_multispectral
  field_measurements:
    active: false              # FileA/FileT under hemp_dir (the default obs path)
    hemp_dir: "C:/DSSAT48/Hemp"
    crop_ext: "HM"
  sentinel2_lai:
    active: false              # CSV: exp_id,treatment,date,value[,cloud_fraction,quality_flag]
    data_path: "obs/sentinel2_lai.csv"
    error_model: { base_rmse: 0.7, saturation_lai: 4.0 }
  uav_multispectral:
    active: false              # CSV: exp_id,treatment,date,variable,value[,flight_quality]
    data_path: "obs/uav.csv"

# How coincident observations from different sources are reconciled.
fusion:
  conflict_resolution: "inverse_variance"   # keep_all | inverse_variance | priority
  source_priority: ["field_measurements", "uav_multispectral", "sentinel2_lai", "modis_lai"]

# In-season assimilation. mode: recalibration is the COUPLED path (re-estimates
# parameters from the data received so far). enkf/forcing are uncoupled prototypes
# and refuse to run unless allow_uncoupled: true (their output is illustrative only).
# Run with:  python run_calibration.py config_hemp.yaml --assimilate
#       or:  python run_calibration.py config_hemp.yaml --combined
assimilation:
  active: false
  mode: "recalibration"        # recalibration | enkf | forcing
  allow_uncoupled: false
  recalibration:
    engine: "glue"             # estimator at each checkpoint
    recal_sample_size: 100     # design size per checkpoint (kept small for speed)
    warm_start: true           # seed each checkpoint with the previous best fit
    update_frequency: "on_observation"   # on_observation | weekly | biweekly
  enkf:                        # PROTOTYPE / uncoupled
    n_ensemble: 50
    inflation: 1.05
    state_variables: ["LAID", "CWAD"]
  forcing:                     # PROTOTYPE / uncoupled
    min_confidence: 0.8
    smoothing: true

# =============================================================================
# IN-SEASON FORECAST / NOWCAST + WEATHER DRIVER (optional — all OFF here)
# See WALKTHROUGH.md §15 and CONCEPT.md §18.
#   python run_calibration.py config_hemp.yaml --nowcast 2024-07-15 --forecast
# =============================================================================
forecast:
  active: false
  variables: ["LAID"]          # DSSAT outputs to project forward
  n_ensemble: 30               # behavioural parameter sets to propagate (0 => best fit only)
  anchor_continuity: true      # start the forecast from the last observation...
  decay_days: 21               # ...and relax back to the pure model over this many days

# Weather acquisition. Default 'file' uses the .WTH DSSAT already resolves (no-op).
weather:
  provider: "file"             # file | nasa_power | dssatutils
  dssatutils_provider: "nasapower"  # when provider=dssatutils; maps to process_weather_*
  # start_year: 2021           # required when provider != file
  # end_year: 2022
  gap_fill: "none"             # none | persistence | climatology (extend record to 'today')
  horizon: 0                   # extra days to extend past the last record (for look-ahead)
  cache_dir: "weather_cache"

# Soil acquisition for synthesized/new-site experiments. Real hemp experiments
# use the installed DSSAT soil files by default.
soil:
  provider: "file"             # file | dssatutils
  source: "ssurgo"             # ssurgo | soilgrids | soilgrids_online
  cache_dir: "soil_cache"
  # source_sol_file: "SoilGrids/US.SOL"  # required when source=soilgrids

# Take planting date from ingested farm-management rows and set it as FileX PDATE
# (an input, not a calibrated parameter).
management_options:
  use_source_planting_date: false

# =============================================================================
# NEW-CROP / SPARSE-DATA HELPERS (optional — see WALKTHROUGH.md §16)
# =============================================================================
# Parameter-file gating. Set species: free ONLY to adapt a new species from an
# analog template (then tag params with group: genetic_species).
gating:
  cultivar: "free"             # free | gated | blocked
  ecotype:  "gated"
  species:  "blocked"

# Identifiability + structural-adequacy diagnostics (writes identifiability.csv /
# structural_adequacy.csv).  CLI: --diagnostics
diagnostics:
  active: false

# Staging: freeze coefficients the data can't constrain (e.g. seed/yield params
# when only mid-season LAI + phenology are available). Add under method:
#   method:
#     staging: { freeze_groups: ["genetic_ecotype"], freeze_params: ["XFRT", "WTPSD"] }
#     validation: { scheme: "site" }   # loeo | year | site | random  (--cv-scheme)
