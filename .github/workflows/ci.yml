name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Span versions so numpy/pandas API drift (e.g. read-only `.values`)
        # is caught here, not in a user's run.
        python-version: ["3.10", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + optional engines + dev)
        # Only PyPI extras: the [shared]/[acquire] extras pull pinned git
        # packages and are exercised separately, not in unit CI.
        run: pip install -e ".[full,dev]"
      - name: Run fast test suite
        run: python -m pytest -m "not slow" -q

  r-parity:
    name: R parity tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The parity runner sources R/ directly and requires only Imports plus
          # the explicitly listed test packages. Installing every Suggests entry
          # would also pull the optional GitHub-only shared DSSAT backends and
          # unrelated calibration engines into this lightweight job.
          dependencies: '"hard"'
          extra-packages: any::testthat, any::jsonlite, any::yaml, any::digest, any::sensitivity
          # No R Markdown/Quarto files are built in this parity job. Avoid the
          # action's separate all-dependencies Pandoc probe, which would pull
          # the optional GitHub-only DSSAT backends back into resolution.
          install-pandoc: false
      - name: Run R parity suite
        run: Rscript run_r_tests.R

  parity-fixtures-current:
    name: Golden fixtures match Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core + optional engines)
        run: pip install -e ".[full]"
      - name: Regenerate parity goldens
        run: PYTHONPATH=python python tests/generate_parity_fixtures.py
      - name: Fail if committed goldens drifted from Python
        run: |
          if ! git diff --quiet -- tests/fixtures; then
            echo "::error::Golden fixtures are stale. Run:"
            echo "  PYTHONPATH=python python tests/generate_parity_fixtures.py"
            echo "and commit tests/fixtures."
            git --no-pager diff --stat -- tests/fixtures
            exit 1
          fi
          echo "Golden fixtures are up to date."
