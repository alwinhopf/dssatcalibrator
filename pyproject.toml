[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatcalibrator"
version = "0.0.1"
description = "Monte-Carlo and Bayesian calibration framework for DSSAT-CSM (concept implementation)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "pymoo>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
shared = [
  "dssatengine @ git+https://github.com/alwinhopf/dssatengine.git@2280b11977ad373b9ae19d2d4497e8f276f7b133",
]
acquire = [
    "dssatutils @ git+https://github.com/alwinhopf/dssatutils.git@e9c859fa1d915623df23e2eb13084cb085dbfe3e",
    "geopandas>=0.14",
    "shapely>=2.0",
]
# Optional engines (lazy-imported only when used). The core — sampling, GLUE,
# SMC-PF, MCMC, Nelder-Mead/diffevo optimisers, Morris screening — needs none of
# these (only numpy/scipy/pymoo, already required).
full = [
    "SALib>=1.4",          # Sobol variance-based sensitivity
    "scikit-learn>=1.2",   # GP / Random-Forest surrogate emulator
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["dssatcalibrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "slow: end-to-end tests that invoke the DSSAT binary (deselect with -m 'not slow')",
]
