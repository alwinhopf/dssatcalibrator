name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  fast-unit:
    name: Fast unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core + optional engines + dev)
        run: pip install -e ".[full,dev]"
      - name: Run fast test suite
        run: pytest -m "not slow" -q --junit-xml=test-results.xml
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-unit-test-results
          path: |
            test-results.xml
            *.log
          if-no-files-found: ignore

  r-parity:
    name: R parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat, any::jsonlite, any::yaml, any::digest, any::sensitivity
          install-pandoc: false
      - name: Run R parity suite
        run: Rscript run_r_tests.R
      - name: Upload R logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-parity-logs
          path: |
            *.log
          if-no-files-found: ignore

  platform-compat:
    name: Platform compatibility (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + optional engines + dev)
        run: pip install -e ".[full,dev]"
      - name: Run fast test suite
        run: pytest -m "not slow" -q --junit-xml=test-results.xml
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-compat-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            *.log
          if-no-files-found: ignore

  fixtures-check:
    name: Golden fixtures match Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core + optional engines)
        run: pip install -e ".[full]"
      - name: Regenerate parity goldens
        run: PYTHONPATH=python python tests/generate_parity_fixtures.py
      - name: Fail if committed goldens drifted from Python
        run: |
          if ! git diff --quiet -- tests/fixtures; then
            echo "::error::Golden fixtures are stale. Run:"
            echo "  PYTHONPATH=python python tests/generate_parity_fixtures.py"
            echo "and commit tests/fixtures."
            git --no-pager diff --stat -- tests/fixtures
            exit 1
          fi
          echo "Golden fixtures are up to date."
